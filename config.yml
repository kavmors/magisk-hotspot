# Strings must be enclosed in matching single or double quotes.
hotspot:
  ssid: "MagiskHotspot"
  password: "change-me-123"
  # Supported values: "2.4GHz", "5GHz", "auto"
  band: "2.4GHz"

network:
  # /32 avoids changing Android's DHCP subnet. Clients reach this address via
  # the hotspot's default route, even when Android chooses another DHCP range.
  ip_address: "192.168.50.1/32"

dns:
  # Hotspot clients resolve this name to network.ip_address.
  domain: "magisk.home.arpa"

behavior:
  boot_delay_seconds: 15
  keep_alive: true
  retry_interval_seconds: 10
